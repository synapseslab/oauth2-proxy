name: CI workflow

on:
  push:
    branches:
      - master

jobs:
  build-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Extract metadata
        id: meta
        run: |
          echo "VERSION=$(git describe --always --tags)" >> "$GITHUB_OUTPUT"
          echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:master-${{ github.sha }}
          build-args: |
            BUILD_IMAGE=docker.io/library/golang:${{ steps.meta.outputs.GO_VERSION }}-bookworm
            RUNTIME_IMAGE=gcr.io/distroless/static:nonroot
            VERSION=${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
